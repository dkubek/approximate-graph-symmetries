# Resources for the OR re-run. Single-threaded: with 2 threads, two pilot jobs
# (24481204[5,6]) had both threads scheduled on one core, where libgomp's
# spin-waiting slowed them >50x. LRM instances have 16 files per simulation,
# so jobs cover 2 simulations to stay well within the walltime (~2 h for LRM).
method_resources:
  OrthogonalRelaxation:
    ncpus: 1
    mem: "4gb"
    scratch_local: "4gb"
    walltime: "04:00:00"
    description: "Orthogonal Relaxation (best-iterate fix)"
    split_simulations: 2
