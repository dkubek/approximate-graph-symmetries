# Resources for the DR re-run. Single-threaded (torch, OMP=1): the local pilot
# (sim 1, all types and sizes, 1 thread) ran ~4-6 s per run. LRM has 16 files
# per simulation, so 10 simulations per job keep LRM jobs at ~1.1 h.
method_resources:
  DimensionalityReduction:
    ncpus: 1
    mem: "4gb"
    scratch_local: "4gb"
    walltime: "03:00:00"
    description: "Dimensionality Reduction (indefinite loss, final iterate)"
    split_simulations: 10
