# Re-run of the paper's DR sweep (sweep_2025-11-21-093506) with
#  - the indefinite loss L_I stated in the paper (the paper sweep used "convex"),
#  - the solver returning its final iterate (bc70fe0; previously the best iterate).
# Same parameter grid, instances and runs as the paper sweep.
parameter_sweeps:
  - method: DimensionalityReduction
    c: [0.001, 0.01, 0.1, 10]
    max_iter: [5000]
    initial_tau: [0.1, 1, 10]
    final_tau: [null]
    loss: ["indefinite"]
    annealing_scheme: ["cosine"]

global_params:
  num_runs: 5
  num_workers: 1
